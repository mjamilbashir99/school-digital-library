<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Greenfield Library</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-root=".." data-role="admin">
  <main class="content">
    <div class="page-head">
      <div>
        <div class="eyebrow" id="today"></div>
        <h1 id="greeting">Dashboard</h1>
        <p>Here's what is happening in the library today.</p>
      </div>
      <div class="actions">
        <a class="btn btn-outline" href="books.html?new=1"><span data-icon="plus"></span>Add book</a>
        <a class="btn btn-primary" href="issue-return.html"><span data-icon="repeat"></span>Issue a book</a>
      </div>
    </div>
    <section class="stats" id="stats" aria-label="Library summary"></section>
    <div class="grid grid-main">
      <section class="card">
        <div class="card-head"><h2>Overdue books</h2><a class="small" href="reports.html">Full report →</a></div>
        <div id="overdue"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Recent activity</h2></div>
        <ul class="list" id="activity"></ul>
      </section>
    </div>
    <div class="grid grid-2 section">
      <section class="card">
        <div class="card-head"><h2>Borrowing by subject</h2><span class="small muted">All loans</span></div>
        <div class="bars" id="subjects"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Reservation queue</h2><a class="small" href="reservations.html">Manage →</a></div>
        <div id="queue"></div>
      </section>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
