<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Digital Library</title>
  <link rel="icon" href="../assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-root=".." data-role="admin">
  <main class="content">
    <div class="page-head">
      <div>
        <h1>Reports</h1>
        <p id="generated"></p>
      </div>
      <div class="actions no-print"><button class="btn btn-outline" id="print" type="button"><span data-icon="print"></span>Print report</button></div>
    </div>
    <section class="stats" id="stats"></section>
    <section class="card card-flush">
      <div class="card-head"><h2>Overdue books</h2><span class="small muted">Send reminders to these members</span></div>
      <div id="overdue"></div>
    </section>
    <div class="grid grid-2 section">
      <section class="card">
        <div class="card-head"><h2>Most borrowed titles</h2></div>
        <div class="bars" id="popular"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Loans by class</h2></div>
        <div class="bars" id="by-class"></div>
      </section>
    </div>
    <section class="card card-flush section">
      <div class="card-head"><h2>Outstanding fines</h2></div>
      <div id="fines"></div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/admin-reports.js"></script>
</body>
</html>
