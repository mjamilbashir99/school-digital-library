<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books · Greenfield Library</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-root=".." data-role="admin">
  <main class="content">
    <div class="page-head">
      <div>
        <h1>Books</h1>
        <p>Every title in the collection, with live copy counts.</p>
      </div>
      <div class="actions"><button class="btn btn-primary" id="add-book" type="button"><span data-icon="plus"></span>Add book</button></div>
    </div>
    <section class="card card-flush">
      <div class="toolbar" style="padding:16px 20px 0">
        <div class="search-input"><span data-icon="search"></span><label class="sr-only" for="q">Search</label><input class="input" id="q" type="search" placeholder="Title, author or accession no."></div>
        <select class="select" id="subject" aria-label="Subject"></select>
        <select class="select" id="level" aria-label="Level"></select>
        <select class="select" id="stock" aria-label="Availability"></select>
        <span class="count" id="count"></span>
      </div>
      <div id="table"></div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/admin-books.js"></script>
</body>
</html>
