<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Digital Library</title>
  <link rel="icon" href="../assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-root=".." data-role="student">
  <main class="content">
    <section class="welcome" id="welcome"></section>
    <div id="alert"></div>
    <section class="stats" id="stats"></section>
    <div class="grid grid-main">
      <section class="card">
        <div class="card-head"><h2>Books with me</h2><a class="small" href="my-books.html">All my books →</a></div>
        <div id="loans"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>My reservations</h2></div>
        <div id="reservations"></div>
      </section>
    </div>
    <section class="card section">
      <div class="card-head"><h2 id="lists-title">Reading lists</h2><a class="small" id="lists-link" href="reading-lists.html" hidden>Manage lists →</a></div>
      <div id="lists"></div>
    </section>
    <section class="card section">
      <div class="card-head"><h2>New on the shelves</h2><a class="small" href="catalog.html">Browse all →</a></div>
      <div id="new"></div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/user-dashboard.js"></script>
</body>
</html>
